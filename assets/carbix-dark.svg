<text x="98" y="118" class="s" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start" >A multimodal VLM platform that turns SME suppliers' unstructured energy bills</text>
<text x="98" y="140" class="s" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start" >and transport documents into Scope 1·2·3 emissions. YOLOv11-seg isolates the</text>
