<text x="98" y="184" class="s" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start" >computes Scope 3 transport. Shipped as a Next.js web app and a Flutter mobile app.</text>
<text x="98" y="220" class="s" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" >I proposed the idea and led a 7-person team across AI, software and business:</text>
<text x="98" y="241" class="s" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" >augmentation pipeline for the VLM dataset, model validation, QA, and every pitch.</text>
